- name: even or odd
  hosts: local
  connection: local
  vars:
   given_number: 10
  tasks:
   - name: is even
     debug: 
       msg:  "given number {{ number }} is even "
     when: given_number % 2 == 0
  
   - name: is odd 
     debug: 
       msg:  "given number {{ number }} is odd "
     when: given_number % 2 != 0
  

   